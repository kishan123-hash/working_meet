{% extends "base.html" %} 
 
{% block title %} 
    Login | MeetSpace 
{% endblock %} 
 
 
{% block extra_css %} 
 
<style> 
 
    /* ================================================= */ 
    /* LOGIN PAGE */ 
    /* ================================================= */ 
 
    .auth-page { 
 
        min-height: calc(100vh - 80px); 
 
        display: flex; 
 
        align-items: center; 
 
        justify-content: center; 
 
        padding: 60px 20px; 
 
        background: 
            radial-gradient( 
                circle at 20% 20%, 
                rgba(59, 130, 246, 0.15), 
                transparent 35% 
            ), 
            radial-gradient( 
                circle at 80% 80%, 
                rgba(124, 58, 237, 0.18), 
                transparent 35% 
            ), 
            #070b18; 
    } 
 
 
    /* ================================================= */ 
    /* LOGIN CARD */ 
    /* ================================================= */ 
 
    .auth-card { 
 
        width: 100%; 
 
        max-width: 460px; 
 
        padding: 40px; 
 
        border-radius: 24px; 
 
        background: 
            rgba(15, 23, 42, 0.94); 
 
        border: 
            1px solid 
            rgba(148, 163, 184, 0.15); 
 
        box-shadow: 
            0 25px 80px 
            rgba(0, 0, 0, 0.45); 
 
        backdrop-filter: blur(20px); 
 
    } 
 
 
    /* ================================================= */ 
    /* HEADER */ 
    /* ================================================= */ 
 
    .auth-header { 
 
        text-align: center; 
 
        margin-bottom: 30px; 
 
    } 
 
 
    .auth-icon { 
 
        width: 70px; 
 
        height: 70px; 
 
        margin: 
            0 auto 18px; 
 
        display: flex; 
 
        align-items: center; 
 
        justify-content: center; 
 
        border-radius: 20px; 
 
        font-size: 32px; 
 
        background: 
            linear-gradient( 
                135deg, 
                #2563eb, 
                #7c3aed 
            ); 
 
        box-shadow: 
            0 12px 35px 
            rgba(59, 130, 246, 0.3); 
 
    } 
 
 
    .auth-header h1 { 
 
        margin: 0; 
 
        color: white; 
 
        font-size: 32px; 
 
        font-weight: 800; 
 
    } 
 
 
    .auth-header p { 
 
        margin-top: 10px; 
 
        color: #94a3b8; 
 
        font-size: 15px; 
 
    } 
 
 
    /* ================================================= */ 
    /* FORM */ 
    /* ================================================= */ 
 
    .form-group { 
 
        margin-bottom: 20px; 
 
    } 
 
 
    .form-group label { 
 
        display: block; 
 
        margin-bottom: 8px; 
 
        color: #e2e8f0; 
 
        font-size: 14px; 
 
        font-weight: 600; 
 
    } 
 
 
    .form-group input { 
 
        width: 100%; 
 
        box-sizing: border-box; 
 
        padding: 14px 16px; 
 
        border-radius: 12px; 
 
        border: 
            1px solid 
            #334155; 
 
        outline: none; 
 
        background: #0f172a; 
 
        color: white; 
 
        font-size: 15px; 
 
        transition: 0.2s; 
 
    } 
 
 
    .form-group input::placeholder { 
 
        color: #64748b; 
 
    } 
 
 
    .form-group input:focus { 
 
        border-color: #6366f1; 
 
        box-shadow: 
            0 0 0 3px 
            rgba(99, 102, 241, 0.15); 
 
    } 
 
 
    /* ================================================= */ 
    /* REMEMBER ME */ 
    /* ================================================= */ 
 
    .login-options { 
 
        display: flex; 
 
        align-items: center; 
 
        justify-content: flex-start; 
 
        margin-bottom: 22px; 
 
        font-size: 13px; 
 
    } 
 
 
    .remember-me { 
 
        display: flex; 
 
        align-items: center; 
 
        gap: 7px; 
 
        color: #94a3b8; 
 
    } 
 
 
    .remember-me input { 
 
        accent-color: #6366f1; 
 
        cursor: pointer; 
 
    } 
 
 
    /* ================================================= */ 
    /* LOGIN BUTTON */ 
    /* ================================================= */ 
 
    .login-button { 
 
        width: 100%; 
 
        border: none; 
 
        padding: 15px; 
 
        border-radius: 12px; 
 
        color: white; 
 
        font-size: 16px; 
 
        font-weight: 700; 
 
        cursor: pointer; 
 
        background: 
            linear-gradient( 
                135deg, 
                #2563eb, 
                #7c3aed 
            ); 
 
        transition: 0.2s; 
 
    } 
 
 
    .login-button:hover { 
 
        transform: translateY(-2px); 
 
        box-shadow: 
            0 12px 30px 
            rgba(99, 102, 241, 0.3); 
 
    } 
 
 
    .login-button:active { 
 
        transform: translateY(0); 
 
    } 
 
 
    /* ================================================= */ 
    /* REGISTER LINK */ 
    /* ================================================= */ 
 
    .auth-footer { 
 
        margin-top: 25px; 
 
        text-align: center; 
 
        color: #94a3b8; 
 
        font-size: 14px; 
 
    } 
 
 
    .auth-footer a { 
 
        color: #818cf8; 
 
        font-weight: 700; 
 
        text-decoration: none; 
 
    } 
 
 
    .auth-footer a:hover { 
 
        text-decoration: underline; 
 
    } 
 
 
    /* ================================================= */ 
    /* MOBILE */ 
    /* ================================================= */ 
 
    @media (max-width: 600px) { 
 
        .auth-card { 
 
            padding: 28px 22px; 
 
        } 
 
 
        .auth-header h1 { 
 
            font-size: 27px; 
 
        } 
 
 
        .login-options { 
 
            flex-direction: column; 
 
            align-items: flex-start; 
 
            gap: 12px; 
 
        } 
 
    } 
 
</style> 
 
{% endblock %} 
 
 
 
{% block content %} 
 
<section class="auth-page"> 
 
    <div class="auth-card"> 
 
 
        <!-- ========================================= --> 
        <!-- LOGIN HEADER --> 
        <!-- ========================================= --> 
 
        <div class="auth-header"> 
 
            <div class="auth-icon"> 
                ✦ 
            </div> 
 
            <h1> 
                Welcome Back 
            </h1> 
 
            <p> 
                Login to continue to MeetSpace. 
            </p> 
 
        </div> 
 
 
 
        <!-- ========================================= --> 
        <!-- LOGIN FORM --> 
        <!-- ========================================= --> 
 
        <form 
            method="POST" 
            action="{{ url_for('meeting.login') }}" 
        > 
 
 
            <!-- ===================================== --> 
            <!-- EMAIL --> 
            <!-- ===================================== --> 
 
            <div class="form-group"> 
 
                <label for="email"> 
                    Email Address 
                </label> 
 
                <input 
                    type="email" 
                    id="email" 
                    name="email" 
                    placeholder="Enter your email" 
                    required 
                    autocomplete="email" 
                > 
 
            </div> 
 
 
 
            <!-- ===================================== --> 
            <!-- PASSWORD --> 
            <!-- ===================================== --> 
 
            <div class="form-group"> 
 
                <label for="password"> 
                    Password 
                </label> 
 
                <input 
                    type="password" 
                    id="password" 
                    name="password" 
                    placeholder="Enter your password" 
                    required 
                    autocomplete="current-password" 
                > 
 
            </div> 
 
 
 
            <!-- ===================================== --> 
            <!-- REMEMBER ME --> 
            <!-- ===================================== --> 
 
            <div class="login-options"> 
 
                <label class="remember-me"> 
 
                    <input 
                        type="checkbox" 
                        name="remember" 
                        value="1" 
                    > 
 
                    Remember me 
 
                </label> 
 
            </div> 
 
 
 
            <!-- ===================================== --> 
            <!-- LOGIN --> 
            <!-- ===================================== --> 
 
            <button 
                type="submit" 
                class="login-button" 
            > 
 
                Login to MeetSpace 
 
            </button> 
 
 
        </form> 
 
 
 
        <!-- ========================================= --> 
        <!-- REGISTER --> 
        <!-- ========================================= --> 
 
        <div class="auth-footer"> 
 
            Don't have an account? 
 
            <a 
                href="{{ url_for('meeting.register') }}" 
            > 
                Create Account 
            </a> 
 
        </div> 
 
 
    </div> 
 
</section> 
 
{% endblock %}
